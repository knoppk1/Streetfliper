<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Navigation Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" id="flashcard">
    <div class="label" id="cardLabel">Current Location</div>
    <div class="text" id="cardText">Loading route...</div>
  </div>

  <div class="controls">
    <button id="prevBtn">Previous</button>
    <button id="nextBtn">Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
